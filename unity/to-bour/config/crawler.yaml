behaviors:
  Crawler:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
      memory:
        memory_size: 128
        sequence_length: 64
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
      curiosity:
        strength: 0.02
        gamma: 0.99
        learning_rate: 3.0e-4
    keep_checkpoints: 70
    max_steps: 60000000
    time_horizon: 1000
    summary_freq: 50000
environment_parameters:
  target_velocity:
    curriculum:
      - name: Lesson0
        completion_criteria:
          measure: reward
          behavior: Crawler
          signal_smoothing: true
          min_lesson_length: 500
          threshold: 375.0
        value: 1.0
      - name: Lesson1
        completion_criteria:
          measure: reward
          behavior: Crawler
          signal_smoothing: true
          min_lesson_length: 500
          threshold: 425.0
        value:
          sampler_type: uniform
          sampler_parameters:
            min_value: 1.0
            max_value: 3.0
      - name: Lesson2
        value:
          sampler_type: uniform
          sampler_parameters:
            min_value: 2.0
            max_value: 5.0

